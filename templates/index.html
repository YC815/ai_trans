<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>多语种翻译</title>
  <!-- 引入 Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex flex-col items-center p-6">
  <h1 class="text-3xl font-bold mb-6">多语种翻译器</h1>

  <form action="/translate" method="post"
        class="w-full max-w-3xl bg-white rounded-lg shadow-lg p-6 space-y-4">
    <div class="flex space-x-4">
      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700 mb-1">源语言</label>
        <select name="src_lang" 
                class="w-full border border-gray-300 rounded px-3 py-2">
          {% for l in langs %}
            <option value="{{l}}" {% if selected_src==l %}selected{% endif %}>{{l}}</option>
          {% endfor %}
        </select>
      </div>
      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700 mb-1">目标语言</label>
        <select name="tgt_lang" 
                class="w-full border border-gray-300 rounded px-3 py-2">
          {% for l in langs %}
            <option value="{{l}}" {% if selected_tgt==l %}selected{% endif %}>{{l}}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">输入文本</label>
      <textarea name="text" rows="6" 
                class="w-full border border-gray-300 rounded px-3 py-2">{{input or ""}}</textarea>
    </div>

    <button type="submit"
            class="w-full bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-700 transition">
      翻译
    </button>
  </form>

  {% if output %}
  <div class="w-full max-w-3xl bg-white rounded-lg shadow-lg p-6 mt-6">
    <h2 class="text-2xl font-semibold mb-4">翻译结果</h2>
    <pre class="whitespace-pre-wrap text-gray-800">{{output}}</pre>
  </div>
  {% endif %}
</body>
</html>
